[project]
name = "rsna-pneumonia-rnd"
version = "0.1.0"
description = "RSNA Pneumonia Detection: reproducible ML R&D baseline, experiments and ablations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "numpy",
    "pandas",
    "pydicom",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "mlflow==3.18.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
